# git prov config for the testing-2 benchmark (Ledgerhub; passed via $PROV_CONFIG, working tree untouched)
schema_version = 1

[environments]
"main" = "prod"
"uat" = "uat"
"release/*" = "release"
"develop" = "dev"

[index]
# scenario pairs and pre-rewrite tips are tags; feature/hotfix lines carry no environment
extra_refs = ["refs/tags/scenario/", "refs/tags/archive/", "refs/remotes/origin/feature/", "refs/remotes/origin/hotfix/"]

[provenance]
read_refs = ["ci", "deploy"]   # refs/notes/provenance holds origin *claims*, which are not evidence

[identity]
window_days = 3650

[gates]
# the README's three validator layers: C library tests, Python unit tests, then the zz integration tests
test_command = "make -s build test-c PY=@PYTHON@ && @PYTHON@ manage.py test tests --settings=ledgerhub.settings.test -p 'test_[!z]*.py' --noinput && @PYTHON@ manage.py test tests --settings=ledgerhub.settings.test -p 'test_zz*.py' --noinput"
test_timeout_s = 900
